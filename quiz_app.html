<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TDIU Quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#0b1f44;--hint:#5d6f92;--accent:#1f63d6;--card:#f3f6fc;--line:#dbe4f3;--red:#d93a3f;--green:#1f9d57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;background:#fff;color:var(--text);min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:url(/logo) center 60%/min(80vw,420px) no-repeat;opacity:.06}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px;min-width:0}
h1 img{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.lang{display:flex;background:var(--card);border-radius:10px;padding:2px}
.lang button{border:0;background:none;color:var(--hint);padding:6px 7px;border-radius:8px;font-weight:600;font-size:12px}
.lang button.on{background:var(--accent);color:#fff}
main{padding:16px 14px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:10px 0;
  box-shadow:0 4px 14px rgba(20,50,110,.07)}
h2{font-size:21px;margin:0 0 10px}
.muted{color:var(--hint);font-size:14px;line-height:1.5}
input{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:14px;
  font-size:17px;outline:none;-webkit-user-select:text;user-select:text;margin:10px 0}
input:focus{border-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;
  background:var(--accent);color:#fff;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.err{color:var(--red);font-size:14px;margin-top:6px;min-height:18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.facts div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.facts b{display:block;font-size:20px;color:var(--accent)}
.facts span{font-size:12px;color:var(--hint)}
ul.rules{padding-left:18px;margin:10px 0;color:var(--hint);font-size:14px;line-height:1.55}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{min-width:54px;text-align:center;font-weight:800;font-size:18px;color:var(--accent);
  border:2px solid var(--accent);border-radius:12px;padding:4px 8px}
.timer.warn{color:var(--red);border-color:var(--red)}
.qtext{font-size:19px;font-weight:700;line-height:1.35;margin:4px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);
  background:#fff;color:var(--text);border-radius:14px;padding:14px;margin:8px 0;font-size:16px;line-height:1.35}
.opt b{flex:0 0 28px;height:28px;border-radius:8px;background:var(--card);color:var(--accent);
  display:flex;align-items:center;justify-content:center}
.opt:active,.opt.sel{border-color:var(--accent);background:#eaf1ff}
.big{font-size:52px;font-weight:800;color:var(--accent);text-align:center;margin:6px 0}
.lb{margin-top:6px}
.lb div{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
.lb div.me{color:var(--accent);font-weight:700}
.warnbox{background:#fff4e5;border:1px solid #ffd59e;color:#8a4b00;border-radius:12px;padding:10px;font-size:14px;margin:10px 0}
.qitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);
  background:#fff;color:var(--text);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 14px rgba(20,50,110,.06)}
.qitem .ic{font-size:26px}
.qitem .tt{flex:1;min-width:0}
.qitem .tt b{display:block;font-size:16px;line-height:1.3}
.qitem .tt span{font-size:13px;color:var(--hint)}
.qitem .st{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.qitem .st.ok{color:var(--green)}
.subj{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:#eaf1ff;
  border-radius:8px;padding:2px 7px;margin-bottom:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;
  padding:7px 11px;font-size:13px;font-weight:600}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btns .btn{margin:0;font-size:15px;padding:13px 8px}
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:16px;padding:14px;
  margin:4px 0 12px;background:linear-gradient(135deg,#1f63d6,#0b3a8a);color:#fff}
.pcard .lv{font-size:30px}.pcard b{display:block;font-size:16px}.pcard span{font-size:13px;opacity:.85}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.srow{margin:10px 0}.srow div{display:flex;justify-content:space-between;font-size:14px}
.rq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.rq .qq{font-weight:700;margin-bottom:8px;line-height:1.35}
.ro{padding:8px 10px;border-radius:10px;margin:4px 0;font-size:15px;border:1px solid transparent}
.ro.right{background:rgba(31,157,87,.12);border-color:rgba(31,157,87,.4)}
.ro.wrong{background:rgba(217,58,63,.1);border-color:rgba(217,58,63,.4)}
.ok{color:var(--green)}.bad{color:var(--red)}
.hidden{display:none}
.spin{display:flex;justify-content:center;padding:60px}
.spin i{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<main id="app"><div class="spin"><i></i></div></main>

const LET = "ABCDEFGH";
const S = {lang:"ru", me:null, quiz:null, st:null, tick:null, busy:false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = () => T[S.lang];
const fmt = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const hap = t => { try { t === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
const INIT = tg ? tg.initData : "";
const START = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("q") || "").toUpperCase();

async function api(path, body) {
  const opt = {headers: {"X-Init-Data": INIT}, keepalive: true};
  if (body) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  return (await fetch(path, opt)).json();
}
function html(h) { clearInterval(S.tick); $("#app").innerHTML = h; }

// ---------- экраны ----------
function screenName() {
  const l = L();
  html(`<div class="card"><h2>👋 ${l.name}</h2><div class="muted">${l.nameHint}</div>
    <input id="nm" placeholder="${l.namePh}" autocomplete="name"><div class="err" id="er"></div>
    <button class="btn" id="go">${l.save}</button></div>`);
  $("#go").onclick = async () => {
    const r = await api("/api/name", {name: $("#nm").value});
    if (!r.ok) { $("#er").textContent = l.badName; return; }
    S.me.name = r.name; hap("ok"); route();
  };
}
async function screenList(msg) {
  const l = L();
  html('<div class="spin"><i></i></div>');
  const r = await api("/api/list");
  S.items = (r.items || []);
  S.msg = msg || "";
  drawList();
}
function drawList() {
  const l = L(), all = S.items || [];
  const subjects = [...new Set(all.map(q => q.subject).filter(Boolean))];
  if (S.subj && !subjects.includes(S.subj)) S.subj = "";
  const items = S.subj ? all.filter(q => q.subject === S.subj) : all;
  html(`<button class="pcard" id="pc"><span class="lv">👤</span><span><b>${l.prof}</b><span>${esc(S.me.name || "")}</span></span></button>
    <h2>📚 ${l.list}</h2>${S.msg ? `<div class="err">${S.msg}</div>` : ""}
    ${subjects.length > 1 ? `<div class="chips"><button data-s="" class="${S.subj ? "" : "on"}">${l.all}</button>${subjects.map(x =>
      `<button data-s="${esc(x)}" class="${S.subj === x ? "on" : ""}">${esc(x)}</button>`).join("")}</div>` : ""}
    ${items.length ? items.map(q => `<button class="qitem" data-c="${q.code}"><span class="ic">${q.result ? "✅" : "📝"}</span>
      <span class="tt">${q.subject ? `<span class="subj">${esc(q.subject)}</span>` : ""}<b>${esc(q.title)}</b>
      <span>${q.n} ${l.q} · ${q.sec} ${l.sec}</span></span>
      <span class="st ${q.result ? "ok" : ""}">${q.result ? q.result.pct + "% · " + q.result.points + "/" + q.result.max : l.go + " ›"}</span></button>`).join("")
      : `<div class="card muted" style="text-align:center">${l.empty}</div>`}`);
  $("#pc").onclick = () => { hap(); screenProfile(); };
  document.querySelectorAll(".chips button").forEach(b => b.onclick = () => { S.subj = b.dataset.s; drawList(); });
  document.querySelectorAll(".qitem").forEach(b => b.onclick = () => {
    hap(); S.quiz = items.find(q => q.code === b.dataset.c); screenIntro();
  });
}
function screenCode(msg) {
  const l = L();
  html(`<div class="card"><h2>🔑 ${l.code}</h2><div class="muted">${l.codeHint}</div>
    <input id="cd" placeholder="A7K2Q9" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;font-weight:700">
    <div class="err" id="er">${msg || ""}</div><button class="btn" id="go">${l.open}</button></div>`);
  $("#go").onclick = async () => {
    const r = await api("/api/quiz?q=" + encodeURIComponent($("#cd").value.trim()));
    if (!r.ok) { $("#er").textContent = l.noQuiz; return; }
    S.quiz = r.quiz; route();
  };
}
function screenIntro() {
  const l = L(), q = S.quiz;
  if (q.result) return screenDone({result: q.result, title: q.title, subject: q.subject, code: q.code, review: q.review}, true);
  if (!q.open) return screenList(l.closed);
  html(`<div class="card">${q.subject ? `<span class="subj">${l.subjL}: ${esc(q.subject)}</span>` : ""}<h2>📝 ${esc(q.title)}</h2>
    <div class="facts"><div><b>${q.n}</b><span>${l.q}</span></div><div><b>${q.sec}</b><span>${l.sec}</span></div><div><b>${q.max || 50}</b><span>${l.pts}</span></div></div>
    <ul class="rules">${l.rules.map(x => `<li>${x}</li>`).join("")}</ul>
    <div class="muted">${l.participant}: <b>${esc(S.me.name)}</b></div>
    <button class="btn" id="go">${l.start}</button></div>`);
  $("#go").onclick = async () => {
    hap();
    const r = await api("/api/start", {code: q.code});
    if (!r.ok) { if (r.error === "done") { const x = await api("/api/result?q=" + q.code); return screenDone({result: x.result, top: x.top, title: q.title, code: q.code}, true); } return screenList(L()[r.error === "closed" ? "closed" : "noQuiz"]); }
    show(r.state);
  };
}
function screenQuestion(st) {
  const l = L();
  html(`<div class="top"><div class="muted">${l.question} <b>${st.i + 1}</b> ${l.of} ${st.n}</div><div class="timer" id="tm">${Math.ceil(st.left)}</div></div>
    <div class="prog"><i style="width:${100 * st.i / st.n}%"></i></div>
    <div class="card"><div class="qtext">${esc(st.text)}</div>
    ${st.opts.map((o, k) => `<button class="opt" data-k="${k}"><b>${LET[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>`);
  const end = Date.now() + st.left * 1000;
  S.tick = setInterval(async () => {
    const left = Math.max(0, (end - Date.now()) / 1000);
    const el = $("#tm"); if (!el) return;
    el.textContent = Math.ceil(left); el.classList.toggle("warn", left <= 5);
    if (left <= 0) { clearInterval(S.tick); setTimeout(async () => show((await api("/api/state")).state), 2200); }
  }, 250);
  document.querySelectorAll(".opt").forEach(b => b.onclick = async () => {
    if (S.busy) return; S.busy = true; b.classList.add("sel"); hap();
    const r = await api("/api/answer", {i: st.i, k: +b.dataset.k});
    S.busy = false; show(r.state);
  });
}
function screenDone(st, already) {
  const l = L(), r = st.result || {};
  const me = S.me.name;
  html(`<div class="card" style="text-align:center"><h2>${already ? "✅ " + l.already : "🏁 " + l.done}</h2>
    <div class="muted">${esc(st.title || "")}</div>
    <div class="big">${r.pct ?? 0}%</div>
    <div class="facts"><div><b>${r.points ?? 0}/${r.max ?? 50}</b><span>${l.pts}</span></div>
    <div><b>${r.score ?? 0}/${r.total ?? 0}</b><span>${l.corr}</span></div>
    <div><b>${r.place ?? "—"}</b><span>${l.place} ${l.of} ${r.all ?? "—"}</span></div></div>
    <div class="muted">⏱ ${l.time}: ${fmt(r.time || 0)}</div>
    ${r.left ? `<div class="warnbox">${l.left.replace("{n}", r.left)}</div>` : ""}
    <div class="btns"><button class="btn" id="cert">${l.cert}</button><button class="btn ghost" id="prof">👤 ${l.prof}</button></div>
    <div id="certmsg" class="muted" style="margin-top:8px"></div>
    ${st.review ? `<button class="btn ghost" id="rev">${l.review}</button>` : `<div class="muted" style="margin-top:10px">${l.reviewLocked}</div>`}</div>
    ${st.top && st.top.length ? `<div class="card"><b>${l.top}</b><div class="lb">${st.top.map((t, i) =>
      `<div class="${t.name === me ? "me" : ""}"><span>${["🥇","🥈","🥉"][i] || (i + 1) + "."} ${esc(t.name)}</span><span>${t.pct}% · ${t.points}/50 · ${fmt(t.time)}</span></div>`).join("")}</div></div>` : ""}
    <button class="btn ghost" id="again">${l.another}</button>`);
  $("#again").onclick = () => { S.quiz = null; screenList(); };
  $("#prof").onclick = () => screenProfile();
  $("#cert").onclick = () => makeCert(st);
  if ($("#rev")) $("#rev").onclick = () => screenReview(st.code, st.title);
  if (!already) hap("ok");
}
// ---------- профиль ----------
async function screenProfile() {
  const l = L();
  html('<div class="spin"><i></i></div>');
  const p = (await api("/api/profile")).profile;
  const span = p.lvl_to ? p.lvl_to - p.lvl_from : 1, done = p.lvl_to ? (p.xp - p.lvl_from) / span : 1;
  html(`<button class="btn ghost" id="bk" style="margin:0 0 10px">${l.back}</button>
    <div class="pcard" style="cursor:default"><span class="lv">${l.lvls[p.level].split(" ")[0]}</span>
      <span><b>${esc(p.name || "")}</b><span>${l.lvls[p.level].split(" ").slice(1).join(" ")} · ${p.xp} ${l.xp}</span></span></div>
    <div class="bar"><i style="width:${Math.round(done * 100)}%"></i></div>
    <div class="muted">${p.lvl_to ? `${p.lvl_to - p.xp} ${l.xp} ${l.toNext}` : l.maxLvl}</div>
    <div class="facts"><div><b>${p.tests}</b><span>${l.tests}</span></div><div><b>${p.avg_pct}%</b><span>${l.avgPct}</span></div>
      <div><b>${p.avg_points}/50</b><span>${l.avgPts}</span></div></div>
    ${p.subjects.length ? `<div class="card"><b>${l.subjects}</b>${p.subjects.map(x => `<div class="srow"><div><span>${esc(x[0])}</span>
      <span>${x[1]}% · ${x[2]}</span></div><div class="bar"><i style="width:${x[1]}%"></i></div></div>`).join("")}</div>` : ""}
    <div class="card"><b>${l.history}</b>${p.history.length ? p.history.map(h => `<button class="qitem" data-c="${h.code}">
      <span class="tt">${h.subject ? `<span class="subj">${esc(h.subject)}</span>` : ""}<b>${esc(h.title)}</b><span>${h.date} · ${l.place} ${h.place}/${h.all}</span></span>
      <span class="st ok">${h.pct}% · ${h.points}/50</span></button>`).join("") : `<div class="muted">${l.noHist}</div>`}</div>
    <button class="btn ghost" id="ren">${l.editName}</button>`);
  $("#bk").onclick = () => { S.quiz = null; screenList(); };
  $("#ren").onclick = () => { S.me.name = ""; screenName(); };
  document.querySelectorAll(".qitem").forEach(b => b.onclick = async () => {
    const r = await api("/api/quiz?q=" + b.dataset.c); if (r.ok) { S.quiz = r.quiz; screenIntro(); }
  });
}

// ---------- разбор ошибок ----------
async function screenReview(code, title, only) {
  const l = L();
  if (only === undefined) only = true;
  html('<div class="spin"><i></i></div>');
  const r = await api("/api/review?q=" + code);
  if (!r.ok) { html(`<div class="card muted">${l.reviewLocked}</div><button class="btn ghost" id="bk">${l.back}</button>`);
    $("#bk").onclick = () => screenList(); return; }
  const bad = r.items.filter(x => !x.ok).length, items = only ? r.items.filter(x => !x.ok) : r.items;
  html(`<button class="btn ghost" id="bk" style="margin:0 0 10px">${l.back}</button><h2>📖 ${esc(title || "")}</h2>
    <div class="muted">${l.mistakes}: <b class="bad">${bad}</b> / ${r.items.length}</div>
    <div class="chips" style="margin-top:8px"><button data-o="1" class="${only ? "on" : ""}">${l.onlyErr}</button>
      <button data-o="0" class="${only ? "" : "on"}">${l.allQ}</button></div>
    ${items.map(x => `<div class="rq"><div class="qq">${x.ok ? "✅" : "❌"} ${esc(x.q)}</div>${x.opts.map((o, k) =>
      `<div class="ro ${k === x.right ? "right" : (k === x.chosen ? "wrong" : "")}">${k === x.right ? "✅" : (k === x.chosen ? "❌" : "▫️")} ${esc(o)}
      ${k === x.chosen && k !== x.right ? `<span class="muted"> — ${l.yours}</span>` : ""}</div>`).join("")}
      ${x.chosen === -1 ? `<div class="muted">⏰ ${l.noAns}</div>` : ""}</div>`).join("")}`);
  $("#bk").onclick = async () => { const q = await api("/api/quiz?q=" + code); if (q.ok) { S.quiz = q.quiz; screenIntro(); } else screenList(); };
  document.querySelectorAll(".chips button").forEach(b => b.onclick = () => screenReview(code, title, b.dataset.o === "1"));
}

// ---------- сертификат ----------
function wrapText(ctx, text, x, y, maxW, lh, maxLines) {
  const words = String(text).split(" "); let line = "", lines = [];
  for (const w of words) { const t = line ? line + " " + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  lines = lines.slice(0, maxLines);
  lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lh));
  return y + lines.length * lh;
}
async function makeCert(st) {
  const l = L(), r = st.result || {}, msg = $("#certmsg");
  msg.textContent = l.certMaking;
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), F = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  x.fillStyle = "#ffffff"; x.fillRect(0, 0, W, H);
  const g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, "#0b3a8a"); g.addColorStop(1, "#1f63d6");
  x.fillStyle = g; x.fillRect(0, 0, W, 300);
  x.strokeStyle = "#1f63d6"; x.lineWidth = 14; x.strokeRect(30, 30, W - 60, H - 60);
  x.strokeStyle = "#c9a227"; x.lineWidth = 4; x.strokeRect(56, 56, W - 112, H - 112);
  try {
    const img = new Image(); img.src = "/logo";
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; });
    x.save(); x.beginPath(); x.arc(W / 2, 300, 110, 0, Math.PI * 2); x.fillStyle = "#fff"; x.fill(); x.clip();
    x.drawImage(img, W / 2 - 100, 200, 200, 200); x.restore();
  } catch (e) {}
  x.textAlign = "center"; x.fillStyle = "#ffffff"; x.font = `800 54px ${F}`; x.fillText("TSUE QUIZ", W / 2, 140);
  x.fillStyle = "#0b1f44"; x.font = `800 76px ${F}`; x.fillText(l.certT, W / 2, 500);
  x.fillStyle = "#5d6f92"; x.font = `400 36px ${F}`; x.fillText(l.certL1, W / 2, 560);
  x.fillStyle = "#1f63d6"; x.font = `800 64px ${F}`; wrapText(x, S.me.name || "", W / 2, 650, W - 180, 70, 2);
  x.fillStyle = "#5d6f92"; x.font = `400 36px ${F}`; x.fillText(l.certL2, W / 2, 730);
  x.fillStyle = "#0b1f44"; x.font = `700 42px ${F}`;
  let y = wrapText(x, "«" + (st.title || "") + "»", W / 2, 795, W - 180, 52, 3);
  if (st.subject) { x.fillStyle = "#5d6f92"; x.font = `600 32px ${F}`; x.fillText(st.subject, W / 2, y + 8); y += 40; }
  const cy = Math.min(1080, Math.max(1030, y + 150));
  x.beginPath(); x.arc(W / 2, cy, 115, 0, Math.PI * 2); x.fillStyle = "#eaf1ff"; x.fill();
  x.lineWidth = 14; x.strokeStyle = "#1f63d6"; x.beginPath();
  x.arc(W / 2, cy, 115, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (r.pct || 0) / 100); x.stroke();
  x.fillStyle = "#1f63d6"; x.font = `800 70px ${F}`; x.fillText((r.pct ?? 0) + "%", W / 2, cy + 24);
  x.fillStyle = "#0b1f44"; x.font = `800 44px ${F}`;
  x.fillText(`${r.points ?? 0}/${r.max ?? 50}`, 205, cy - 5); x.fillText(`${r.score ?? 0}/${r.total ?? 0}`, W - 205, cy - 5);
  x.fillStyle = "#5d6f92"; x.font = `400 26px ${F}`;
  x.fillText(l.pts, 205, cy + 35, 250); x.fillText(l.corr, W - 205, cy + 35, 250);
  x.font = `400 28px ${F}`;
  x.fillText(`${l.place}: ${r.place ?? "—"} / ${r.all ?? "—"}  ·  ${new Date().toLocaleDateString()}`, W / 2, 1250);
  const img = c.toDataURL("image/jpeg", 0.9);
  try {
    const res = await api("/api/cert", {code: st.code, img});
    if (!res.ok) throw 0;
    msg.innerHTML = l.certSent + (tg && tg.shareToStory && res.url ? ` <button class="btn" id="story">${l.story}</button>` : "");
    hap("ok");
    if ($("#story")) $("#story").onclick = () => { try { tg.shareToStory(res.url, {text: "TSUE QUIZ 🎓 " + (r.pct ?? 0) + "%"}); } catch (e) {} };
  } catch (e) { msg.textContent = "❗"; }
}

async function show(st) {
  S.st = st;
  if (st.status === "question") return screenQuestion(st);
  if (st.status === "done") {
    if (!st.top) { const x = await api("/api/result?q=" + st.code); st.top = x.top; }
    return screenDone(st, false);
  }
  route();
}
function route() {
  $("#hdr").textContent = L().hdr;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === S.lang));
  if (!S.me) return;
  if (!S.me.name) return screenName();
  if (S.st && S.st.status === "question") return screenQuestion(S.st);
  if (S.quiz) return screenIntro();
  screenList();
}

// ---------- защита: свернул приложение — вопрос сгорает ----------
document.addEventListener("visibilitychange", async () => {
  if (document.hidden && S.st && S.st.status === "question") {
    S.st = (await api("/api/leave", {init: INIT})).state;
  } else if (!document.hidden && S.st) { show((await api("/api/state")).state); }
});
document.addEventListener("contextmenu", ev => ev.preventDefault());
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  S.lang = b.dataset.l; api("/api/lang", {lang: S.lang});
  if (S.st && S.st.status === "question") return screenQuestion(S.st);
  if (!S.quiz && S.items) { $("#hdr").textContent = L().hdr; document.querySelectorAll(".lang button").forEach(x => x.classList.toggle("on", x.dataset.l === S.lang)); return drawList(); }
  route();
});

(async function init() {
  if (!INIT) { html(`<div class="card"><h2>📱</h2><div class="muted">${T.ru.auth}<br>${T.uz.auth}</div></div>`); return; }
  const r = await api("/api/me" + (START ? "?q=" + START : ""));
  if (!r.ok) { html(`<div class="card">${T.ru.auth}</div>`); return; }
  S.me = r; S.lang = T[r.lang] ? r.lang : "ru"; S.quiz = r.quiz; S.st = r.state;
  if (START && !r.quiz) { route(); return screenList(L().noQuiz); }
  route();
})();
</script>
